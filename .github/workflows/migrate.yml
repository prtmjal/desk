name: Migrate database

# Run by hand (Actions → Migrate database → Run workflow) before deploying a release that
# adds a migration. Needs the repository secret DATABASE_URL (the owner role, not app_user).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "migrate" to apply pending migrations to the production database
        required: true

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'migrate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

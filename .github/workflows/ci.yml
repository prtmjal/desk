name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Offline release gate on the demo golden set (cached model outputs, no API key, no cost).
      - name: Evals
        run: pnpm evals

      # The whole app must build with no secrets at all (integrations are gated on env);
      # only public, non-secret values are provided here.
      - name: Build web
        run: pnpm --filter @desk/web build
        env:
          APP_URL: https://desk.example.com
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
